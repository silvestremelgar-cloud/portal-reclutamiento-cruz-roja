<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica PHP - SIVIC</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Contacto SIVIC</h1>
        <p>
            Sistema de Incorporación y Vinculación Institucional
            de la Cruz Roja Boliviana - Filial Guayaramerín.
        </p>
    </header>
    <main>
        <h2>Formulario de contacto</h2>
        <form method="POST" action="procesar.php">
            <div>
                <label for="nombre">Nombre completo:</label>
                <input
                    type="text" id="nombre" name="nombre" required>
            </div>
            <br>
            <div>
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>
            </div>
            <br>
            <div>
                <label for="mensaje">Mensaje:</label>
                <br>
                <textarea id="mensaje" name="mensaje" rows="5" required ></textarea>
            </div>
            <br>
            <button type="submit">Enviar mensaje</button>
        </form>
    </main>
    <footer>
        <p>
            © 2026 Cruz Roja Boliviana - Filial Guayaramerín
        </p>
    </footer>
</body>
</html>
